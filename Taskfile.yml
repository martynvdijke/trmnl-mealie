version: "3"

vars:
  GO_APP_DIR: .
  PORT: "8080"
  BIN: trmnl-mealie

tasks:
  default:
    desc: Show available tasks
    cmd: task --list

  # ── Setup ─────────────────────────────────────────────

  setup:
    desc: Install Go module dependencies
    cmd: go mod download
    dir: "{{.GO_APP_DIR}}"

  # ── Build ──────────────────────────────────────────────

  build:
    desc: Build Go binary
    cmd: go build -o {{.BIN}} .
    dir: "{{.GO_APP_DIR}}"
    sources:
      - "{{.GO_APP_DIR}}/**/*.go"
      - "{{.GO_APP_DIR}}/go.mod"
      - "{{.GO_APP_DIR}}/go.sum"
    generates:
      - "{{.GO_APP_DIR}}/{{.BIN}}"

  # ── Development (hot reload) ──────────────────────────

  dev:
    desc: Run Go server with hot reload via air
    cmd: air
    dir: "{{.GO_APP_DIR}}"

  # ── Run (no hot reload) ──────────────────────────────

  run:
    desc: Run Go server
    cmd: go run .
    dir: "{{.GO_APP_DIR}}"

  # ── Test ──────────────────────────────────────────────

  test:
    desc: Run Go tests
    cmd: go test ./...
    dir: "{{.GO_APP_DIR}}"

  # ── Clean ─────────────────────────────────────────────

  clean:
    desc: Remove all build artifacts
    cmds:
      - rm -f {{.BIN}}
      - rm -rf tmp
    dir: "{{.GO_APP_DIR}}"
